[package]
name = "email8-mta"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Email8-dev/email8-mta"
rust-version = "1.85"
description = "Sentin8 Email8:Mta - SMTP/LMTP transfer engine, queue, DKIM, reports."

[[bin]]
name = "email8-mta"
path = "src/main.rs"

[lib]
name = "email8_mta_server"
path = "src/lib.rs"

[dependencies]
# Platform SDK pin (RS 2.3) - the only cross-repo dependency; carries the
# entire shared library workspace behind the `sentin8` facade.
sentin8 = { git = "https://github.com/Sentin8/sentin8-sdk", tag = "sdk-v0.6.7" }
# email8 namespace facade pin - carries this vertical's contracts/clients.
email8 = { git = "https://github.com/Email8-dev/email8-sdk", tag = "email8-v0.5.8" }

axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors", "compression-gzip", "limit"] }
hyper = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots-no-provider", "stream"], default-features = false }
rustls = { version = "0.23", features = ["std", "tls12", "logging"], default-features = false }
rustls-graviola = "0.4"
rustls-native-certs = "0.8"
rustls-pki-types = "1"
sha2 = "0.10"
tokio-rustls = { version = "0.26", features = ["ring"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "macros"] }
# Valkey GLIDE - the platform's sole Valkey client engine (group
# DESIGN.md §3.1): rate limits/greylisting/fail2ban present the MTA's
# certificate identity via the SDK factory.
valkey-glide = "0.9.0"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
futures-util = "0.3"
utoipa = { version = "5", features = ["chrono", "uuid"] }
blake3 = "1"
base64 = "0.22"
async-trait = "0.1"
memchr = "2"
sentin8-stat-sdk = { git = "https://github.com/Sentin8/sentin8-stat", tag = "stat-sdk-v0.6.6" }
sentin8-storage-sdk = { git = "https://github.com/Sentin8/sentin8-storage", tag = "storage-sdk-v0.3.1" }
sentin8-secrets-sdk = { git = "https://github.com/Sentin8/sentin8-secrets", tag = "secrets-sdk-v0.4.0" }
